<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* BEAST ENGINE — Format A: caption-delivered list / title-on-background.
         Clone of @lifeliftman rel/DeRsolMAyoa mechanics:
         one calm walking B-roll shot, large centered 4-line white title with
         heavy dark outline, title static for the whole clip; the list itself
         belongs in the post caption, never on screen. */
      @font-face {
        /* Inter, not Montserrat: the reference's lowercase g is single-storey and
           its within-title line-width ratios match Inter to 1.3% while Montserrat
           runs ~9% wider. Measured on A1/A3 at native 720p, normalised to 1080. */
        font-family: "Inter";
        src: url("assets/fonts/inter.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      :root {
        --ink: #ffffff;
        --outline: #09090b;
        --font-display: "Inter", "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--font-display);
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Per-variant grade: the engine writes --bg-filter so every background
           lands inside the reference's measured luma/saturation band. The
           reference has NO scrim, so legibility comes from the outline alone. */
        filter: var(--bg-filter, none);
      }
      #title {
        /* Centred by its own middle, not its top: the auto-fit step shrinks the
           type for long lines, and a top-anchored block would then drift upward.
           No bottom bias: the reference block is centred at 49.9% of height
           (42.0-57.7% measured on A1), so plain flex centring is correct. */
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 36px;
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        /* Measured: 946px line width at 1080 needs 81px (Inter 100px renders
           "You can spot a man who" at 1172px); pitch 81.3px -> line-height 1.00. */
        font-size: 81px;
        line-height: 1.00;
        letter-spacing: 0;
        text-transform: none;
        /* Measured: 72% of the 4px ring around the glyphs is near-black (median
           luma 16), i.e. a hard outline; 4px at 1080 matches the reference edge
           after accounting for video compression. No drop shadow. */
        -webkit-text-stroke: 4px var(--outline);
        paint-order: stroke fill;
      }
      #title .line { display: block; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <video id="bg" class="clip" src="assets/media/bg.mp4" muted playsinline
             data-start="0" data-duration="12" data-media-start="0"></video>
      <div id="title" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>
      <audio id="bgm" src="assets/audio/bgm.m4a" class="clip" data-start="0" data-duration="12"
             data-volume="0.35" data-fade-in="0.6" data-fade-out="1.2"></audio>
    </div>
    <script>
      /* CONTENT is replaced per variant by the factory pipeline (see content.json).
         Rules from the reference: max 4 lines, sentence case, no emoji. */
      const CONTENT = {
        titleLines: [
          "8 things you do after",
          "a conversation when",
          "you're worried you",
          "sounded weird",
        ],
        captionItems: [],
        captionTakeaway: "",
      };
      // Render copy from CONTENT so a variant is a pure data swap.
      // Text colour follows the footage's brightness (chosen by the engine).
      if (CONTENT.textStyle && CONTENT.textStyle.fill) {
        const ts = CONTENT.textStyle;
        document.documentElement.style.setProperty("--ink", ts.fill);
        const node = document.getElementById("title");
        if (node && ts.stroke_px != null) {
          node.style.webkitTextStroke = ts.stroke_px + "px #000000";
        }
      }
      document.getElementById("title").innerHTML = CONTENT.titleLines
        .map((line) => `<span class="line">${line}</span>`).join("");
      // Auto-fit: shrink the type until the longest authored line fits, so
      // variant copy never re-wraps into a 5th line (format allows max 4).
      {
        const el = document.getElementById("title");
        let fs = 81;
        el.style.fontSize = fs + "px";
        while (el.scrollWidth > el.clientWidth && fs > 52) {
          fs -= 2;
          el.style.fontSize = fs + "px";
        }
      }
      window.__timelines = window.__timelines || {};
      // Reference mechanics: the title is STATIC from the very first frame —
      // no fade, no slide, no scale, and the background is a locked shot (no
      // push-in). The timeline exists only to register the composition.
      const tl = gsap.timeline({ paused: true });
      tl.set("#title", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
