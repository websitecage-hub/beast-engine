name: measure

on:
  schedule:
    - cron: "0 4,10,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: beast-measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Harvest insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The confession learner FIRST (ENGINE_SPEC.md "Scoring"): it reads
          # insights at 24h and 72h, derives sends-per-1k and hold, assigns
          # win/flop/neither, and mutates the family weights every 6 scored
          # posts. Then the legacy harvest, which the old pipeline still uses.
          python -m src.score || echo "score failed; continuing"
          python -m src.run_measure
      - name: Commit state
        if: always()
        run: |
          git config user.name "beast-engine[bot]"
          git config user.email "beast-engine[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ || true
          git commit -m "measure: state update" || echo "nothing to commit"
          git push || (git pull --rebase --autostash && git push) || echo "push failed, next run recovers"
