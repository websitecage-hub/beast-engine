name: preview

# The production run: renders one of the two pilot formats (A: caption_list_title_v1,
# B: social_moment_loop_v1), delivers it to the Telegram review channel and, when
# publishing is on, posts it to Instagram. src/run_preview.py still never publishes
# by itself: publication is a separate step (src/run_publish.py) that only touches a
# reel whose status is "rendered", so the same reel cannot post twice.
#
# It runs TWICE A DAY on schedule. The auto router picks the format with fewer
# previews, so the two runs alternate A and B. A manual dispatch keeps its own
# inputs; a scheduled run has none, so it publishes and delivers by default.

on:
  schedule:
    # 09:00 and 17:00 UTC. GitHub's scheduler can fire late; each wake renders one
    # reel and the format is chosen by the router, not by the clock.
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "A, B or auto (auto = the format with fewer previews)"
        required: false
        default: "auto"
      topic:
        description: "optional territory / moment to write about"
        required: false
        default: ""
      quality:
        description: "render quality"
        required: false
        default: "delivery"
      deliver:
        description: "send the preview to the Telegram review channel"
        type: boolean
        required: false
        default: true
      publish:
        description: "publish the rendered reel to Instagram after QA passes"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A scheduled run carries no inputs, and an automatic twice-a-day pipeline has
      # to publish and deliver without a human filling in a form. A manual dispatch
      # keeps whatever it was given.
      RUN_FORMAT: ${{ inputs.format || 'auto' }}
      RUN_QUALITY: ${{ inputs.quality || 'delivery' }}
      RUN_DELIVER: ${{ github.event_name == 'schedule' || inputs.deliver }}
      RUN_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg (HyperFrames shells out to `ffmpeg` on PATH)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile check (fail fast on syntax errors)
        run: python -m compileall -q src research
      - name: Verify ffmpeg is available
        run: |
          python -c "from src import config; p=config.resolve_ffmpeg(); print('ffmpeg:', p)"
          python -c "from src import config; import subprocess; p=config.resolve_ffmpeg(); subprocess.run([p,'-version'],check=True,stdout=subprocess.DEVNULL)"
      - name: Preview
        env:
          # A GitHub runner has no /opt/work and a small workspace: every cache
          # lives in the runner temp dir, so nothing lands in the repo checkout.
          BEAST_SCRATCH: ${{ runner.temp }}/beast-scratch
          BEAST_ASSET_CACHE: ${{ runner.temp }}/beast-assets
          TMPDIR: ${{ runner.temp }}
          # The ledger is durable state and must survive the runner, so it lives
          # in the repo and is committed back below (like the other workflows).
          BEAST_LEDGER: ${{ github.workspace }}/data/asset_ledger.json
          BEAST_WRITER_TIMEOUT: "120"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--format $RUN_FORMAT --quality $RUN_QUALITY"
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ inputs.topic }}\""; fi
          if [ "$RUN_DELIVER" != "true" ]; then ARGS="$ARGS --no-deliver"; fi
          mkdir -p "$BEAST_SCRATCH" "$BEAST_ASSET_CACHE"
          eval python -m src.run_preview $ARGS
      - name: Publish the rendered two-format reel to Instagram
        # Never publish on a failed run: a scheduled wake that could not render would
        # otherwise fall through to whatever reel is still sitting at status rendered.
        if: ${{ env.RUN_PUBLISH == 'true' && success() }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m src.run_publish --format $RUN_FORMAT
      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            data/template_manifest.json
            outputs/previews/*.mp4
          if-no-files-found: warn
          retention-days: 14
      - name: Commit preview state
        if: always()
        run: |
          git config user.name "beast-engine[bot]"
          git config user.email "beast-engine[bot]@users.noreply.github.com"
          # The manifest is an append-only list keyed by run_id, written by every run
          # (CI and local), so a textual rebase conflicts constantly. The semantic
          # driver unions the two sides by run_id instead.
          git config merge.manifest.name "manifest union-merge (by run_id)"
          git config merge.manifest.driver "python3 -m scripts.merge_manifest %O %A %B"
          git pull --rebase --autostash -X manifest || true
          # A conflicted file must never be committed: committed conflict markers are
          # what turned the manifest unreadable and silently broke every later run.
          if grep -rlE '^(<{7}|={7}|>{7})( |$)' data/ 2>/dev/null; then
            echo "conflict markers found in data/ - repairing before commit"
            python3 -m scripts.repair_data_json data
          fi
          git add data/ || true
          git commit -m "preview: manifest + asset ledger" || echo "nothing to commit"
          git push || (git pull --rebase --autostash -X manifest && git push) || echo "push failed, next run recovers"
