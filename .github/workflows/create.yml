name: create

on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the reel but do not publish it"
        type: boolean
        default: false
      force:
        description: "Ignore the off-day/window rules (never the one-post-per-day cap)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: beast-create
  cancel-in-progress: false

jobs:
  # Gate the publish on the acceptance suite. Without this, a regression in
  # src/ only surfaced when someone ran the tests by hand — CI would happily build
  # and post a reel with broken placement. Cheap (no deps, no network) and it runs
  # before any secrets are needed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Acceptance tests
        run: python -m tests.test_acceptance

  create:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Verify ffmpeg is available
        run: |
          # ffmpeg is a hard runtime dependency (music, background, build_video,
          # pinterest all shell out to it). Fail here with a clear message rather
          # than halfway through a render.
          python -c "from src import config; p=config.resolve_ffmpeg(); print('ffmpeg:', p)"
          python -c "from src import config; import subprocess,sys; p=config.resolve_ffmpeg(); subprocess.run([p,'-version'],check=True,stdout=subprocess.DEVNULL)"
      - name: Create reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          export BEAST_FORCE_POST=1
          python -m src.run_create $ARGS
      - name: Commit state
        if: always()
        run: |
          git config user.name "beast-engine[bot]"
          git config user.email "beast-engine[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ || true
          git commit -m "create: state update" || echo "nothing to commit"
          git push || (git pull --rebase --autostash && git push) || echo "push failed, next run recovers"