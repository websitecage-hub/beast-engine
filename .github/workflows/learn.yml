name: learn

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: beast-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Learn from performance
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The legacy weekly analyser. It scores the OLD pipeline's attribute
          # families (archetype/topic/mood/bg_type), which the confession format
          # does not use, so it is kept only so the previous setup stays
          # auditable — it is NOT what learns from confession reels.
          # The confession learner runs in measure.yml (src/score.py), because
          # ENGINE_SPEC.md needs insights read at 24h and 72h.
          python -m src.run_learn
      - name: Commit state
        if: always()
        run: |
          git config user.name "beast-engine[bot]"
          git config user.email "beast-engine[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ || true
          git commit -m "learn: state update" || echo "nothing to commit"
          git push || (git pull --rebase --autostash && git push) || echo "push failed, next run recovers"
